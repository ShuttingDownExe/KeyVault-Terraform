name: Terraform

on:
  push:
    branches:
      - main
    paths:
      - '**/*.tf'
      - 'tfvars/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - '**/*.tf'
      - 'tfvars/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:
    inputs:
      action:
        description: Terraform action to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      tfvars_file:
        description: Optional tfvars file under tfvars/ (for example gavl-A071-indent.tfvars)
        required: false
        default: gavl-A071-indent.tfvars
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.8.5
  TF_CLI_ARGS: -no-color

jobs:
  terraform:
    name: Validate and optionally plan/apply
    runs-on: arc-runner-set-keyvault

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          unzip -o /tmp/terraform.zip -d "$HOME/bin"
          chmod +x "$HOME/bin/terraform"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Check Terraform version
        run: terraform version

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Determine Azure auth availability
        id: azure_auth
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply')
        shell: bash
        run: |
          set -euo pipefail
          client_id="${{ secrets.AZURE_CLIENT_ID || vars.AZURE_CLIENT_ID }}"
          tenant_id="${{ secrets.AZURE_TENANT_ID || vars.AZURE_TENANT_ID }}"
          subscription_id="${{ secrets.AZURE_SUBSCRIPTION_ID || vars.AZURE_SUBSCRIPTION_ID }}"

          if [ -n "$client_id" ] && [ -n "$tenant_id" ] && [ -n "$subscription_id" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "client_id=$client_id" >> "$GITHUB_OUTPUT"
            echo "tenant_id=$tenant_id" >> "$GITHUB_OUTPUT"
            echo "subscription_id=$subscription_id" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Azure credentials are not fully configured. Skipping Azure login and deployment steps."
          fi

      - name: Azure login
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply') && steps.azure_auth.outputs.enabled == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ steps.azure_auth.outputs.client_id }}
          tenant-id: ${{ steps.azure_auth.outputs.tenant_id }}
          subscription-id: ${{ steps.azure_auth.outputs.subscription_id }}

      - name: Terraform init for deployment
        if: github.event_name == 'workflow_dispatch' && (inputs.action == 'plan' || inputs.action == 'apply') && steps.azure_auth.outputs.enabled == 'true'
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ steps.azure_auth.outputs.client_id }}
          ARM_TENANT_ID: ${{ steps.azure_auth.outputs.tenant_id }}
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_auth.outputs.subscription_id }}
        run: terraform init -input=false

      - name: Terraform plan
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'plan' && steps.azure_auth.outputs.enabled == 'true'
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ steps.azure_auth.outputs.client_id }}
          ARM_TENANT_ID: ${{ steps.azure_auth.outputs.tenant_id }}
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_auth.outputs.subscription_id }}
        run: |
          terraform plan -input=false -lock=false -var-file="tfvars/${{ inputs.tfvars_file }}"

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && steps.azure_auth.outputs.enabled == 'true'
        env:
          ARM_USE_OIDC: true
          ARM_CLIENT_ID: ${{ steps.azure_auth.outputs.client_id }}
          ARM_TENANT_ID: ${{ steps.azure_auth.outputs.tenant_id }}
          ARM_SUBSCRIPTION_ID: ${{ steps.azure_auth.outputs.subscription_id }}
        run: |
          terraform apply -auto-approve -input=false -var-file="tfvars/${{ inputs.tfvars_file }}"
